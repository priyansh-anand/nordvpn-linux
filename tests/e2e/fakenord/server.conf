# OpenVPN server for the e2e tests; proto, port, dev and subnet come from the command line.
topology subnet
ca /pki/ca.crt
cert /pki/vpn.crt
key /pki/vpn.key
dh none
tls-auth /pki/ta.key 0
data-ciphers AES-256-GCM:AES-256-CBC
auth SHA512
comp-lzo no
keepalive 10 60
persist-key
verify-client-cert none
username-as-common-name
script-security 2
auth-user-pass-verify /fakenord/checkpw.sh via-file
push "dhcp-option DNS 10.8.0.1"
verb 3
